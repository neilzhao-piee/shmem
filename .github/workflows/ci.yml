name: ci
on: [push, pull_request]
jobs:
  check:
    # ubuntu-24.04, not ubuntu-latest: the 26.04 image has no setup-python build
    # for 3.9, and the README declares 3.9 as the floor — the floor must stay tested.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m py_compile tools/*.py
      - run: find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +
      - run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
      - run: python3 -W error::ResourceWarning tests/test_shmem.py
      - run: bash eval/run.sh
      - run: |
          SHMEM_ROOT=examples python3 -W error::ResourceWarning tools/memory-search.py --full "restic" | grep -q journal
          SHMEM_ROOT=examples python3 -W error::ResourceWarning tools/memory-search.py --full "备份 prune" | grep -q journal
          cd examples && bash ../tools/make-digest.sh
